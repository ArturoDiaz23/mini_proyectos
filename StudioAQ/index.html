<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="main.css">
  <!--Material desing-->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <script type="importmap">
        {
          "imports": {
            "@material/web/": "https://esm.run/@material/web/"
          }
        }
      </script>
  <script type="module">
    import '@material/web/all.js';
    import { styles as typescaleStyles } from '@material/web/typography/md-typescale-styles.js';

    document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
  </script>
  <title>Inicio de sesión</title>
</head>

<body>
  <div class="container contenido">
    <div class="format_content_card">
      <img class="img_logo" src="scr/img/CC_Express_20220405_2301300.23943868920352973_20250821_205036_0000.png"
        alt="Logo studio Aquino">
      <div class="card sesion-card">
        <!-- formulario-->
        <form action="" id="login_form" class="grid_items">
          <!-- <h3>Studio Aquino</h3> -->
          <md-outlined-text-field label="Correo" id="email_input" name="email" type="email" autocomplete="off"
            placeholder="email@email.com">
            <!-- <md-icon id="icon-bottom" slot="trailing-icon">cancel</md-icon> -->
          </md-outlined-text-field>
          <md-outlined-text-field label="Contraseña" id="password_input" name="password" type="password"
            autocomplete="off" placeholder="********">
            <!-- <md-icon id="icon-bottom" slot="trailing-icon">cancel</md-icon> -->
          </md-outlined-text-field>

          <span id="cambiar_btn">Tengo una cuenta</span>

          <button class="btn hidden" id="btn_login">
            Iniciar Sesión
          </button>
          <button class="btn" id="btn_singup">
            Registrarse
          </button>
        </form>
        <span>Conectate con</span>
        <div class="flex_items ">
          <!-- Button google-->
          <button class="btn" id="btn_google">
            <svg height="30" width="30" viewBox="0 0 640 640">
              <use href="../fontawesome-free-7.0.0-web/svgs-full/brands/google.svg"></use>
            </svg>
          </button>
          <!-- Button apple-->
          <button class="btn" id="btn_apple">
            <svg height="30" width="30" viewBox="0 0 640 640">
              <use href="../fontawesome-free-7.0.0-web/svgs-full/brands/apple.svg"></use>
            </svg>
          </button>
        </div>
      </div>

    </div>

  </div>

  <script src="../fontawesome-free-7.0.0-web/js/fontawesome.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.min.js"
    integrity="sha384-7qAoOXltbVP82dhxHAUje59V5r2YsVfBafyUDxEdApLPmcdhBPg1DKg1ERo0BZlK"
    crossorigin="anonymous"></script>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script type="module" src="main.js"></script>
</body>

</html>
